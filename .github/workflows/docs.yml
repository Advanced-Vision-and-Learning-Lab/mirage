name: Docs checks

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "demo.py"
      - "dataloader/**"
      - "metrics/**"
      - "models/**"
      - "predict/**"
      - "scripts/**"
      - "slurm/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "demo.py"
      - "dataloader/**"
      - "metrics/**"
      - "models/**"
      - "predict/**"
      - "scripts/**"
      - "slurm/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"

jobs:
  broken-links:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: First test: code changes include documentation
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/check_docs_coverage.py "$BASE_SHA" "$HEAD_SHA"
      - name: Check reference results against CSV
        run: python3 scripts/check_results_tables.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Mintlify CLI
        run: npm install --global mint
      - name: Check internal documentation links
        run: mint broken-links
