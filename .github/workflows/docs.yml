name: Docs checks

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/plot_model_results.py"
      - "docs/model-results.csv"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/plot_model_results.py"
      - "docs/model-results.csv"
      - ".github/workflows/docs.yml"

jobs:
  broken-links:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install chart check dependency
        run: python -m pip install pillow==11.3.0
        working-directory: .
      - name: Regenerate and check the homepage results graph
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from PIL import Image

          csv_hash = hashlib.sha256(Path("docs/model-results.csv").read_bytes()).hexdigest()
          with Image.open("docs/images/model-results.png") as chart:
              chart_hash = chart.info.get("source-csv-sha256")
          if chart_hash != csv_hash:
              raise SystemExit("Homepage chart is stale. Run python scripts/plot_model_results.py and commit the updated image.")
          PY
          python scripts/plot_model_results.py
        working-directory: .
      - name: Install Mintlify CLI
        run: npm install --global mint
      - name: Check internal documentation links
        run: mint broken-links
