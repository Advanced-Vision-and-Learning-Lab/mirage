name: Docs checks

on:
  pull_request:
    paths:
      - "docs/**"
      - "demo.py"
      - "models/**"
      - "predict/**"
      - "metrics/**"
      - "dataloader/**"
      - "slurm/demo.slurm"
      - "requirements.txt"
      - "tests/test_demo_model_choices.py"
      - "scripts/plot_model_results.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "demo.py"
      - "models/**"
      - "predict/**"
      - "metrics/**"
      - "dataloader/**"
      - "slurm/demo.slurm"
      - "requirements.txt"
      - "tests/test_demo_model_choices.py"
      - "scripts/plot_model_results.py"
      - ".github/workflows/docs.yml"

jobs:
  broken-links:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation contract test dependencies
        run: python -m pip install pillow==10.1.0 pytest
        working-directory: .
      - name: Check registered model documentation and CLI options
        run: python -m pytest -q tests/test_demo_model_choices.py
        working-directory: .
      - name: Regenerate and check the homepage results graph
        run: |
          python scripts/plot_model_results.py
          git diff --exit-code -- docs/images/model-results.png
        working-directory: .
      - name: Install Mintlify CLI
        run: npm install --global mint
      - name: Check internal documentation links
        run: mint broken-links
